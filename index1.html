<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Unión Musical - Concierto Junio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-principal: #009688; 
            --color-header: #55bebf;
            --gris-claro: #7d8592;
            --azul-noche: #2c3e50;
            --background: #f4f6f9;
            --naranja-brillante: #e67e22;
            --tarjeta: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background);
            color: var(--azul-noche);
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 25px 20px;
            background-color: var(--color-principal);
            color: white;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .header h1 { margin: 0 0 5px 0; font-weight: 700; }
        .header p { margin: 0; font-size: 0.9rem; color: rgba(255, 255, 255, 0.9); }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 40px;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 5px solid rgba(0, 0, 0, 0.05);
            border-top: 5px solid var(--color-principal);
            border-radius: 50%;
            animation: spinLoader 0.8s linear infinite;
        }

        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .ranking-card {
            background: var(--tarjeta);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border-top: 5px solid var(--color-principal);
        }

        .ranking-card h2 {
            text-align: center;
            color: var(--azul-noche);
            border-bottom: 2px solid var(--background);
            padding-bottom: 15px;
            margin-top: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .fila-ranking {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            margin-bottom: 10px;
            background: var(--background);
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .fila-ranking:hover { transform: scale(1.01); }

        .fila-ranking:nth-child(1) {
            background: var(--naranja-brillante);
            color: white;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.2);
        }

        .puntos {
            background: var(--color-principal);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
        }

        .fila-ranking:nth-child(1) .puntos {
            background: white;
            color: var(--naranja-brillante);
        }

        .instrumento-tag {
            font-size: 0.75em;
            font-weight: 500;
            color: var(--gris-claro);
            display: block;
            margin-top: 2px;
        }
        
        .fila-ranking:nth-child(1) .instrumento-tag { color: rgba(255,255,255,0.9); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏆 Concurso Concierto Junio</h1>
        <p>Resultados actualizados en tiempo real</p>
    </div>

    <div id="cargando" class="loader-container">
        <div class="loader-spinner"></div>
        <p style="color: var(--azul-noche); font-weight: 500;">Conectando con Google Drive...</p>
    </div>

    <div class="grid" id="resultados" style="display: none;">
        <div class="ranking-card">
            <h2>🥇 Top Músicos Promotores</h2>
            <div id="rankingMusicos"></div>
        </div>
        <div class="ranking-card">
            <h2>🎷 Cuerda Más Vendedora</h2>
            <div id="rankingCuerdas"></div>
        </div>
    </div>

    <script>
        // Tu enlace, pero hemos forzado que escupa TSV (separado por tabulaciones) para evitar problemas con comas
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTy0RNR5x70buZKbY0YyafpCjZzrXCGSISUnFm8fGKg7nBNPQ9QYc6f6jGmrDRtN6bKd_rRbSJpDoKd/pub?gid=0&single=true&output=tsv";

        window.onload = async function() {
            try {
                const response = await fetch(GOOGLE_SHEET_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const text = await response.text();
                document.getElementById('cargando').style.display = 'none';
                procesarDatos(text);
                
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('cargando').innerHTML = `
                    <p style='color:#e74c3c; text-align:center;'>
                        ⚠️ <b>Conexión bloqueada por tu navegador.</b><br><br>
                        Sube este archivo .html a tu servidor de PythonAnywhere<br>para que los permisos de seguridad funcionen correctamente.
                    </p>`;
            }
        };

        function procesarDatos(text) {
            // Separa el texto por saltos de línea y luego por tabulaciones
            let rows = text.split('\n').map(row => row.split('\t'));
            
            let musicos = [];
            let cuerdas = {};
            let musicoActual = null;
            let startIndex = 1;

            // Busca dinámicamente en qué fila empieza la tabla (saltando filas vacías arriba)
            for (let i = 0; i < rows.length; i++) {
                if (rows[i][0] && rows[i][0].trim() === "Instrumento") {
                    startIndex = i + 1; // Los datos empiezan justo debajo
                    break;
                }
            }

            for (let i = startIndex; i < rows.length; i++) {
                let row = rows[i];
                if (!row || row.length < 2) continue; // Salta filas completamente vacías

                let instrumento = row[0] ? row[0].trim() : "";
                let nombre = row[1] ? row[1].trim() : "";
                
                // Limpia los números por si vienen con coma europea (ej. "30,50")
                let entradasStr = row[2] ? String(row[2]).replace(',', '.') : "0";
                let importeStr = row[4] ? String(row[4]).replace(',', '.') : "0";
                
                let entradas = parseFloat(entradasStr) || 0;
                let importePatrocinio = parseFloat(importeStr) || 0; 
                
                let puntosFila = entradas + (importePatrocinio / 3);

                if (instrumento !== "" && nombre !== "") {
                    // Es un músico principal
                    musicoActual = {
                        nombre: nombre,
                        instrumento: instrumento,
                        puntos: puntosFila
                    };
                    musicos.push(musicoActual);
                } else if (musicoActual) {
                    // Columna 1 y 2 vacías: Es una fila extra del patrocinador del músico anterior
                    musicoActual.puntos += puntosFila;
                }
            }

            // Agrupa por instrumentos
            musicos.forEach(m => {
                if (!cuerdas[m.instrumento]) cuerdas[m.instrumento] = 0;
                cuerdas[m.instrumento] += m.puntos;
            });

            // Filtra músicos con 0 puntos si no quieres que salgan todos (opcional) y ordena
            musicos = musicos.filter(m => m.puntos > 0).sort((a, b) => b.puntos - a.puntos);
            
            let arrayCuerdas = Object.keys(cuerdas).map(k => ({ nombre: k, puntos: cuerdas[k] }));
            arrayCuerdas = arrayCuerdas.filter(c => c.puntos > 0).sort((a, b) => b.puntos - a.puntos);

            renderizar(musicos, arrayCuerdas);
        }

        function renderizar(musicos, cuerdas) {
            document.getElementById('resultados').style.display = 'grid';

            // Músicos
            let htmlMusicos = musicos.length > 0 ? '' : '<p style="text-align:center; color:var(--gris-claro)">Aún no hay puntos registrados</p>';
            musicos.forEach((m, index) => {
                let prefijo = index === 0 ? '👑 ' : (index + 1) + '. ';
                htmlMusicos += `
                    <div class="fila-ranking">
                        <div>
                            <span>${prefijo} ${m.nombre}</span>
                            <span class="instrumento-tag">${m.instrumento}</span>
                        </div>
                        <span class="puntos">${m.puntos.toFixed(1)} pts</span>
                    </div>
                `;
            });
            document.getElementById('rankingMusicos').innerHTML = htmlMusicos;

            // Cuerdas
            let htmlCuerdas = cuerdas.length > 0 ? '' : '<p style="text-align:center; color:var(--gris-claro)">Aún no hay puntos registrados</p>';
            cuerdas.forEach((c, index) => {
                let prefijo = index === 0 ? '🏆 ' : (index + 1) + '. ';
                htmlCuerdas += `
                    <div class="fila-ranking">
                        <span>${prefijo} ${c.nombre}</span>
                        <span class="puntos">${c.puntos.toFixed(1)} pts</span>
                    </div>
                `;
            });
            document.getElementById('rankingCuerdas').innerHTML = htmlCuerdas;
        }
    </script>
</body>
</html>
